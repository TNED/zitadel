x-zitadel-db-env: &zitadel-db-env
  ZITADEL_DATABASE_POSTGRES_DSN: ${ZITADEL_DATABASE_POSTGRES_DSN}

services:
  zitadel-init:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: "no"
    command: init
    environment:
      <<: *zitadel-db-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zitadel

  zitadel-setup:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: "no"
    command: setup --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      <<: *zitadel-db-env
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE}

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
    networks:
      - zitadel

  zitadel-api:
    command: start --masterkey "${ZITADEL_MASTERKEY}"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-init:
        condition: service_completed_successfully
      zitadel-setup:
        condition: service_completed_successfully
